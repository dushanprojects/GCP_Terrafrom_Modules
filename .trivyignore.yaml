# Findings that have been reviewed and are not fixed in the code, with the
# reason and a date to look at them again. Each entry is limited to the files it
# applies to, so the same check still runs everywhere else. Everything else is
# expected to be fixed rather than ignored.

misconfigurations:
  - id: AVD-GCP-0015
    paths:
      - "modules/db_mysql/main.tf"
    statement: >-
      The check asks for require_ssl on the Cloud SQL instance. Google
      deprecated that argument and removed it from the provider in version 7,
      so it cannot be set. The module sets its replacement,
      ssl_mode = "ENCRYPTED_ONLY", which enforces the same thing.
    expiredAt: 2027-03-01

  - id: AVD-GCP-0048
    paths:
      - "modules/gke_regional_cluster/nodepool_gke_components.tf"
      - "modules/gke_regional_cluster/nodepools_app.tf"
    statement: >-
      Both node pools and the short lived default node pool of the cluster set
      disable-legacy-endpoints to true in their node config. Checkov reads the
      same setting and passes, so this is a limitation of how this check reads
      the metadata map rather than a gap in the configuration.
    expiredAt: 2027-03-01
